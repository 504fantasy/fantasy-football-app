{% extends "base.html" %}
{% block title %}Sign In — Survivor{% endblock %}
{% block content %}
<div style="max-width:360px;margin:60px auto;">
  <h1 style="font-size:22px;margin-bottom:20px;">Sign In</h1>
  {% if error %}<div class="alert alert-error">Invalid username or password.</div>{% endif %}
  {% if registered %}<div class="alert alert-success">Account created! Sign in below.</div>{% endif %}
  <div class="card">
    <form method="post" action="/survivor/login">
      <div class="form-group"><label>Username</label><input type="text" name="username" autofocus required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
    </form>
    <p style="margin-top:14px;text-align:center;color:var(--muted);font-size:13px;">
      No account? <a href="/survivor/register">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
