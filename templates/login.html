<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign In — 504 Fantasy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0c10;--s1:#111418;--s2:#181c23;--border:#252a34;--gold:#e8b84b;--gold2:#f5d06a;--text:#e8eaf0;--muted:#64748b;--r:8px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;
      background-image:radial-gradient(ellipse 90% 55% at 50% -5%,rgba(232,184,75,.09) 0%,transparent 65%)}
    .box{width:100%;max-width:390px}
    .logo{text-align:center;margin-bottom:1.75rem}
    .logo h1{font-family:'Barlow Condensed',sans-serif;font-size:2.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
    .logo p{color:var(--muted);font-size:.875rem;margin-top:.2rem}
    .card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:2rem}
    h2{font-family:'Barlow Condensed',sans-serif;font-size:1.35rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1.4rem}
    .fg{margin-bottom:.9rem}
    label{display:block;font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.3rem}
    input{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);padding:.58rem .8rem;font-family:'Barlow',sans-serif;font-size:.9rem;width:100%;transition:border-color .15s}
    input:focus{outline:none;border-color:var(--gold)}
    .btn{display:block;width:100%;padding:.68rem;background:var(--gold);color:#0a0c10;border:none;border-radius:var(--r);font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;margin-top:1.4rem;transition:background .15s}
    .btn:hover{background:var(--gold2)}
    .alert{padding:.6rem .85rem;border-radius:var(--r);font-size:.84rem;margin-bottom:1.1rem;border-left:3px solid}
    .alert-err{background:rgba(239,68,68,.09);border-color:#ef4444;color:#f87171}
    .alert-ok {background:rgba(34,197,94,.09);border-color:#22c55e;color:#4ade80}
    .foot{text-align:center;margin-top:1.1rem;font-size:.84rem;color:var(--muted)}
    .foot a{color:var(--gold);text-decoration:none}
    .foot a:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="box">
  <div class="logo"><h1>504 FANTASY</h1><p>Fantasy Playoff Challenge</p></div>
  <div class="card">
    <h2>Sign In</h2>
    {% if request.query_params.get('error') %}<div class="alert alert-err">Invalid username or password.</div>{% endif %}
    {% if request.query_params.get('registered') %}<div class="alert alert-ok">Account created! Sign in below.</div>{% endif %}
    <form method="post" action="/login">
      <div class="fg"><label>Username</label><input name="username" type="text" autocomplete="username" required autofocus/></div>
      <div class="fg"><label>Password</label><input name="password" type="password" autocomplete="current-password" required/></div>
      <button class="btn">Sign In</button>
    </form>
    <div class="foot">No account? <a href="/register">Register here</a></div>
  </div>
</div>
</body>
</html>
